version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (TypeScript, ESLint, Node types) are done by hand, deliberately, not proposed automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Deliberately not watched: the worker image's Node version (Dockerfile), the Postgres the database tests run against
  # (ci.yml), .nvmrc and the engines field in package.json. They name the long-term-support line, and are moved together by
  # hand when the next one arrives. A Docker watcher would propose node:25-slim, a short-lived release.
