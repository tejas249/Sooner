version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (TypeScript, ESLint, Node types) are done by hand, deliberately, not proposed automatically.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The worker's base image (node:24-slim) and the database image the tests use are updated by hand when Node or Postgres moves on.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
